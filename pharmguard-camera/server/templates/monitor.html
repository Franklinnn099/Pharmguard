<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera monitor · PharmGuard</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0b0f17;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid #1e293b}
  h1{font-size:18px;margin:0} .muted{color:#94a3b8;font-size:13px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px;padding:16px}
  .tile{background:#111827;border:1px solid #334155;border-radius:8px;overflow:hidden}
  .tile.alert{border-color:#ef4444;box-shadow:0 0 0 2px #ef4444}
  .tile img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#000}
  .meta{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;font-size:13px;flex-wrap:wrap}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#64748b}
  .on .dot{background:#22c55e} .badge{padding:1px 6px;border-radius:4px;font-weight:600}
  .badge.ALERT,.badge.ACTIVE{background:#ef4444;color:#fff} .badge.REVIEW{background:#f59e0b;color:#111}
  .slow{background:#eab308;color:#1c1300;font-weight:700;padding:6px 10px;font-size:13px}
  .empty{padding:32px 16px;color:#94a3b8}
  a{color:#38bdf8}
</style></head>
<body>
<header><h1>PharmGuard camera monitor</h1><span class="muted" id="info">connecting…</span></header>
<div id="grid"></div>
<script>
const grid = document.getElementById('grid'), info = document.getElementById('info');
const tiles = {};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function poll(){
  try{
    const r = await fetch('/api/cameras',{cache:'no-store'}); const j = await r.json();
    info.textContent = `detector: ${j.detector} (${j.model}) · ${j.cameras.length} camera(s)`;
    if(!j.cameras.length){grid.innerHTML = `<div class="empty">No cameras yet. Pair a phone at <a href="/pair">/pair</a>.</div>`; for(const k in tiles) delete tiles[k]; return;}
    else if(grid.querySelector('.empty')) grid.innerHTML='';
    for(const c of j.cameras){
      let t = tiles[c.camera_id];
      if(!t){ t = document.createElement('div'); t.className='tile';
        t.innerHTML = `<img alt="Camera ${esc(c.camera_id)}" src="/view/${encodeURIComponent(c.camera_id)}"><div class="slow" hidden></div><div class="meta"></div>`;
        grid.appendChild(t); tiles[c.camera_id]=t; }
      const st = (c.alarm && c.alarm.state) || 'IDLE';
      const hot = c.flagged>0 || /ACTIVE|ALERT/.test(st);
      t.classList.toggle('alert', hot);
      const slow = t.querySelector('.slow'); slow.hidden = !c.slow;
      slow.textContent = `⚠ ${c.fps} fps: too slow for reliable detection (need 5+). Check Wi-Fi / move closer to the router.`;
      t.querySelector('.meta').innerHTML =
        `<span class="${c.connected?'on':''}"><span class="dot"></span><strong>${esc(c.camera_id)}</strong> ${c.connected?'live':'offline'}</span>`+
        `<span>${c.fps} fps · ${c.persons} person(s)${c.flagged?` · <span class="badge REVIEW">${c.flagged} for staff review</span>`:''}`+
        `${st!=='IDLE'?` · <span class="badge ${esc(st)}">${esc(st)}</span>`:''}`+
        ` · <a href="/zones/${encodeURIComponent(c.camera_id)}">Zones</a></span>`;
    }
  }catch(e){ info.textContent = 'server unreachable'; }
}
poll(); setInterval(poll, 1000);
</script>
</body></html>
