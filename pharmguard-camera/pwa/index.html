<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>PharmGuard Camera</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#000;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #stage{position:fixed;inset:0}
  video,canvas#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
       padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(11,15,23,.85);backdrop-filter:blur(6px)}
  input{width:7.5em;background:#111827;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:8px;font-size:15px}
  button{background:#0ea5e9;color:#04111c;border:0;border-radius:6px;padding:9px 14px;font-weight:700;font-size:15px}
  button.stop{background:#dc2626;color:#fff}
  button.sec{background:#1e293b;color:#e2e8f0;border:1px solid #334155}
  a.btn{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:8px 12px;font-weight:600;font-size:15px;text-decoration:none}
  #status{flex:1;min-width:10em;font-size:13px;color:#94a3b8}
  #status b{color:#e2e8f0}
  #flag{position:fixed;top:0;left:0;right:0;padding:10px 16px;text-align:center;font-weight:700;display:none;background:#dc2626;color:#fff}
  #err{position:fixed;top:30%;left:16px;right:16px;padding:16px;border-radius:8px;background:#1e293b;display:none;line-height:1.5}
  #err code{background:#0b0f17;padding:1px 5px;border-radius:4px;word-break:break-all}
</style>
</head><body>
<div id="stage"><video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas></div>
<div id="flag">For staff review</div>
<div id="err"></div>
<div id="bar">
  <input id="cam" aria-label="Camera name" maxlength="32" placeholder="camera name">
  <button id="go">Start</button>
  <button id="objs" class="sec" aria-label="Which objects to show">Objects: Key</button>
  <button id="alarm" class="stop" style="display:none">Acknowledge</button>
  <a id="zones" class="btn" href="/zones/phone1">Zones</a>
  <span id="status">Idle</span>
</div>
<script src="/app.js"></script>
</body></html>
